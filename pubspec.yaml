name: hunt_together
description: Collective hunting coordination
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  maplibre: ^0.4.0-pre.2
  geolocator: ^14.0.0
  path_provider: ^2.1.3
  cupertino_icons: ^1.0.6
  supabase_flutter: ^2.8.0
  shared_preferences: ^2.3.0
  flutter_compass: ^0.8.1
  audioplayers: ^6.0.0

dev_dependencies:
  flutter_launcher_icons: ^0.14.1

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "icon_master.png"
  adaptive_icon_background: "#2E4A2C"
  adaptive_icon_foreground: "icon_foreground.png"
  min_sdk_android: 23

flutter:
  uses-material-design: true
  assets:
    - assets/styles/
    - assets/images/
    - assets/icons/
    - assets/sounds/

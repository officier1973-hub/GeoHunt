name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5   # Обновлено с v4

      - name: Setup Java
        uses: actions/setup-java@v5 # Обновлено с v4 (если v5 ещё нет, можно вернуть v4 — это не критично)
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2.23.0 # Указана конкретная версия, где cache уже на Node 24
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v6   # Обновлено с v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk

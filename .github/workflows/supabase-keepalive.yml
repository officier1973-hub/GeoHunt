name: Keep Supabase Alive

on:
  schedule:
    - cron: '0 9 */2 * *' # Раз в 2 дня в 09:00 UTC
  workflow_dispatch:

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase DB
        run: |
          STATUS=$(curl -s -o /tmp/resp.txt -w "%{http_code}" \
            -X POST "${{ secrets.SUPABASE_URL }}/rest/v1/rpc/keepalive_ping" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{}')
          echo "HTTP Status: $STATUS"
          cat /tmp/resp.txt
          test "$STATUS" -ge 200 -a "$STATUS" -lt 300
